version: 2.1

executors:
  # The tool author's own image ships renovate-config-validator on the node
  # version renovate declares in `engines`, so the two cannot drift apart.
  # Renovate tracks this tag, and each bump is validated by the version it
  # introduces. Do not swap this for a bare node image plus `npm install
  # renovate`: npm resolves backwards to a release whose engines accept the
  # image's node, ageing the validator silently instead of failing.
  renovate:
    docker:
      - image: ghcr.io/renovatebot/renovate:43.265.4

jobs:
  validate-config:
    executor: renovate
    steps:
      - checkout
      - run:
          name: Show validator version
          command: renovate-config-validator --version
      - run:
          name: Validate config - default.json
          command: renovate-config-validator --strict default.json

workflows:
  validation:
    jobs:
      - validate-config
